<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>戰爭迷霧 — 專案管理即時戰略</title>
<meta name="description" content="星海爭霸風格的專案管理即時戰略：先暫停教學、一次學一個動作，玩懂供給卡住、技術債、三層視野與信任。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1420'/%3E%3Cpath d='M16 5l10 5.5v11L16 27 6 21.5v-11z' fill='none' stroke='%233ee0a1' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5b942'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:rgba(10,17,28,.92);--panel2:rgba(22,35,52,.95);--line:rgba(130,180,215,.22);--ink:#e9f1f7;--dim:#8fa4b6;--teal:#3ee0a1;--amber:#f5b942;--blue:#5aa9ff;--red:#ff5a4d;--pink:#ff6b9a;--violet:#a58bff;--font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#stage.cmd{cursor:crosshair}
.hide{display:none!important}
.off{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}

/* ── HUD ─────────────────────────────── */
#hud{position:absolute;inset:0;pointer-events:none}
#hud.off{display:none}
#hud>*{pointer-events:auto}
#tl{position:absolute;left:12px;top:12px;padding:8px 12px;max-width:min(340px,42vw)}
#mTitle{font-size:11px;letter-spacing:.14em;color:var(--amber);font-weight:700}
#mGoal{font-size:14px;font-weight:700;margin-top:2px}
#mSub{font-size:12px;color:var(--dim);margin-top:2px}
#mSub:empty{display:none}
#mSub b{color:var(--ink)}
#mSub .bad{color:var(--red)}
#tc{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#clock{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 8px #000}
#clock:empty{display:none}
#pausedTag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(245,185,66,.16);border:1px solid rgba(245,185,66,.5);color:var(--amber)}
#pausedTag:empty{display:none}
#pausedTag.go{background:rgba(62,224,161,.14);border-color:rgba(62,224,161,.5);color:var(--teal)}
#tr{position:absolute;right:12px;top:12px;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
.pill{display:flex;align-items:baseline;gap:7px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:92px;transition:border-color .2s,background .2s}
.pill b{font-family:var(--mono);font-size:17px;font-weight:700}
.pill small{font-size:11px;color:var(--dim);font-family:var(--mono);margin-left:auto}
.pill .g{width:11px;height:11px;flex:none;align-self:center;display:inline-block}
.g.ore{background:var(--blue);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%)}
.g.sup{background:var(--amber);border-radius:2px;clip-path:polygon(0 30%,100% 30%,100% 100%,0 100%)}
.g.debt{background:var(--pink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.g.trust{background:var(--red);clip-path:path('M5.5 10 1 5.2C-.6 3.3.6 0 3 0c1 0 2 .6 2.5 1.4C6 .6 7 0 8 0c2.4 0 3.6 3.300 2 5.200z')}
.pill.warn{border-color:var(--amber);background:rgba(245,185,66,.12)}
.pill.bad{border-color:var(--red);background:rgba(255,90,77,.16);animation:blink .7s infinite alternate}
.pill.up b{color:var(--teal)}.pill.down b{color:var(--red)}
@keyframes blink{to{background:rgba(255,90,77,.34)}}
.ibtn{width:34px;min-width:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--dim)}
.ibtn:hover{color:var(--ink);border-color:var(--dim)}
#views{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#views button{padding:7px 14px;font-size:12px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:6px;border-right:1px solid var(--line)}
#views button:last-child{border-right:0}
#views button i{font-style:normal;font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:4px}
#views button.on{background:var(--amber);color:#1a1200}
#views button.on i{border-color:rgba(0,0,0,.35)}
#feed{position:absolute;left:12px;top:96px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(360px,46vw)}
#feed div{font-size:12px;padding:3px 9px;border-radius:6px;background:rgba(7,11,18,.66);color:var(--ink);border-left:3px solid var(--dim);animation:feedin .25s ease-out;transition:opacity .6s}
#feed div.warn{border-color:var(--amber)}#feed div.bad{border-color:var(--red);color:#ffd0cb}#feed div.good{border-color:var(--teal)}
#feed div.old{opacity:0}
@keyframes feedin{from{transform:translateX(-14px);opacity:0}}

#bTech{cursor:pointer;color:var(--violet);border-color:rgba(165,139,255,.5);min-width:0}#bTech b{font-size:13px;color:var(--ink)}#bTech:hover{background:rgba(165,139,255,.15)}
#tech{position:absolute;right:12px;top:60px;width:min(372px,calc(100vw - 24px));max-height:calc(100vh - 230px);overflow:auto;padding:12px;z-index:5}
#tech .th{display:flex;align-items:center;gap:8px}#tech .th b{font-size:15px}#tech .th .sub{font-size:11px;color:var(--dim);font-family:var(--mono)}#tech .th .x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
#tech .curr{margin-top:10px;padding:9px 11px;background:var(--panel2);border:1px solid rgba(165,139,255,.35);border-radius:10px}#tech .cn{font-size:13px}#tech .cn.dim{color:var(--dim)}#tech .cm{font-size:12px;color:var(--dim);margin-top:5px}
#tech .crew{display:flex;gap:6px;margin-top:10px}#tech .pip{flex:1;height:46px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:flex-end}
#tech .pip i{display:block;width:100%;background:rgba(255,255,255,.1)}#tech .pip.go i{background:rgba(245,185,66,.5)}#tech .pip.on i{background:var(--violet)}#tech .pip span{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:10px;font-family:var(--mono);color:var(--ink)}
#tech .acts{display:flex;gap:6px;margin-top:8px}#tech .acts .btn{padding:6px 10px;font-size:12px}
#tech .note{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.55}#tech .note b{color:var(--amber)}
#tech .projs{display:grid;gap:8px;margin-top:10px}
#tech .proj{padding:10px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);position:relative}#tech .proj.lock{opacity:.62}#tech .proj.done{border-color:rgba(62,224,161,.5)}#tech .proj.cur{border-color:var(--violet)}
#tech .pn{font-weight:700;font-size:13.5px}#tech .pn small{margin-left:6px}#tech .lv{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);margin-right:3px;vertical-align:-1px}#tech .lv.on{background:var(--violet);border-color:var(--violet)}
#tech .pf{font-size:12px;color:#c1d0dc;margin-top:3px}#tech .pc{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:4px}#tech .pb{font-size:11.5px;color:#d9ccff;margin-top:4px;line-height:1.5}#tech .pb b{color:var(--amber)}#tech .pw{font-size:11.5px;color:var(--amber);margin-top:4px}
#tech .go{margin-top:8px;padding:6px 12px;font-size:12.5px;width:100%;background:var(--violet);color:#120a30}#tech .go[disabled]{background:rgba(255,255,255,.08);color:var(--dim)}
/* 底部三塊：避開平台注入的「← ToolHub」（左下）與 ♥（右下） */
#bl{position:absolute;left:138px;bottom:12px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#mm{display:block;width:224px;height:116px;cursor:pointer}
#bc{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(440px,calc(100vw - 720px));min-width:280px;padding:10px 12px;min-height:88px}
#br{position:absolute;right:104px;bottom:12px;display:grid;grid-template-columns:repeat(3,92px);gap:5px}
#idle{position:absolute;left:138px;bottom:148px;padding:6px 12px;border-radius:10px;background:rgba(245,185,66,.16);border:1px solid var(--amber);color:var(--amber);font-weight:700;font-size:12px}
#home{position:absolute;left:138px;bottom:186px;width:34px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:16px}
#idle.hide+#home{bottom:148px}

.cbtn{position:relative;height:64px;padding:6px 5px 5px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s,border-color .15s,background .15s}
.cbtn:hover:not(.dis){border-color:var(--teal);background:rgba(62,224,161,.1)}
.cbtn:active:not(.dis){transform:scale(.96)}
.cbtn .n{font-size:12.5px;font-weight:700;line-height:1.2;padding-right:10px}
.cbtn .c{font-size:10px;color:var(--dim);font-family:var(--mono);line-height:1.2}
.cbtn .k{position:absolute;right:5px;top:3px;font-size:10px;font-family:var(--mono);color:var(--dim);opacity:.85}
.cbtn.dis{opacity:.42;cursor:not-allowed}
.cbtn.on{border-color:var(--amber);background:rgba(245,185,66,.14)}
.cbtn.short{border-color:var(--red)}
.cbtn.empty{visibility:hidden}
.cbtn.pulse{animation:cpulse 1s infinite}
@keyframes cpulse{50%{box-shadow:0 0 0 4px rgba(62,224,161,.35)}}

.ihead{display:flex;align-items:center;gap:10px}
.ico{width:42px;height:42px;flex:none;border-radius:9px;background:linear-gradient(160deg,#20364a,#0f1b29);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.ico.eng::before{content:"";width:16px;height:22px;border-radius:8px 8px 4px 4px;background:var(--teal);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.ico.hub::before{content:"";width:26px;height:26px;background:var(--teal);clip-path:polygon(50% 0,100% 28%,100% 78%,50% 100%,0 78%,0 28%);opacity:.9}
.ico.comms::before{content:"";width:22px;height:22px;background:var(--amber);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%)}
.ico.obs::before{content:"";width:22px;height:22px;border:3px solid var(--violet);border-radius:50%;box-shadow:inset 0 0 0 4px rgba(165,139,255,.25)}
.ico.feat::before{content:"";width:20px;height:20px;background:var(--amber);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ico.squad::before{content:"";width:22px;height:22px;background:var(--amber);clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}
.ico.plat::before{content:"";width:22px;height:22px;background:var(--violet);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.ico.node::before{content:"";width:22px;height:12px;border:3px solid var(--teal);border-radius:50%}
.grp span.f{background:var(--amber)}
.ico.lab::before{content:"";width:22px;height:22px;background:var(--violet);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%);opacity:.9}
.g.tech{background:var(--violet);border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.ico.debt::before{content:"";width:20px;height:20px;background:var(--pink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ico.ore::before{content:"";width:20px;height:22px;background:var(--blue);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%)}
.iname{font-weight:700;font-size:14px}
.iname small{font-size:11px;color:var(--dim);font-weight:400;margin-left:6px}
.istate{font-size:12px;color:var(--dim);margin-top:1px}
.istate b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .12s linear}
.bar.amber i{background:var(--amber)}
.queue{display:flex;gap:4px;margin-top:8px}
.queue span{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);position:relative;overflow:hidden}
.queue span i{position:absolute;left:0;bottom:0;width:100%;background:rgba(62,224,161,.5)}
.queue span.f{border-color:var(--teal)}
.queue span::after{content:"";position:absolute;inset:6px 9px;border-radius:5px 5px 2px 2px;background:var(--teal);opacity:.85}
.grp{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.grp span{width:22px;height:26px;border-radius:5px 5px 3px 3px;background:var(--teal);opacity:.85;border:2px solid rgba(255,255,255,.15)}
.grp span.idle{background:var(--amber)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;background:rgba(245,185,66,.18);color:var(--amber);vertical-align:1px}
.tag.bad{background:rgba(255,90,77,.2);color:var(--red)}
.tag.good{background:rgba(62,224,161,.18);color:var(--teal)}
.tag.v{background:rgba(165,139,255,.2);color:var(--violet)}

#dragbox{position:absolute;border:1px solid var(--teal);background:rgba(62,224,161,.1);display:none;pointer-events:none}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,0);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30}
#toast div{padding:9px 18px;border-radius:10px;font-weight:700;font-size:15px;background:rgba(10,17,28,.94);border:1px solid var(--amber);color:var(--amber);animation:toast 2.6s ease-out forwards;text-align:center;max-width:86vw}
#toast div.bad{border-color:var(--red);color:#ffb3ac;background:rgba(40,10,10,.94)}
#toast div.good{border-color:var(--teal);color:var(--teal)}
@keyframes toast{0%{opacity:0;transform:translateY(8px) scale(.96)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* ── 教學 Coach ─────────────────────── */
#coach{position:absolute;inset:0;pointer-events:none;z-index:40}
#coach.off{display:none}
#spot{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:14px;box-shadow:0 0 0 100vmax rgba(3,6,10,.36),0 0 0 0 rgba(245,185,66,0);border:2px solid var(--amber);transition:opacity .2s;animation:spot 1.1s ease-in-out infinite}
#spot.round{border-radius:50%}
#spot.none{opacity:0;animation:none}
@keyframes spot{50%{border-color:rgba(245,185,66,.5);box-shadow:0 0 0 100vmax rgba(3,6,10,.36),0 0 18px 4px rgba(245,185,66,.6)}}
#ptr{position:absolute;left:0;top:0;width:0;height:0}
#ptr::before{content:"";position:absolute;left:-14px;top:-38px;width:28px;height:34px;background:var(--amber);clip-path:polygon(50% 100%,0 40%,32% 40%,32% 0,68% 0,68% 40%,100% 40%);filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));animation:bob .7s ease-in-out infinite alternate}
#ptr.up::before{top:6px;transform:rotate(180deg);animation-name:bobu}
#ptr.none{display:none}
@keyframes bob{to{transform:translateY(-9px)}}
@keyframes bobu{from{transform:rotate(180deg) translateY(0)}to{transform:rotate(180deg) translateY(-9px)}}
#bubble{position:absolute;left:0;top:0;width:min(330px,88vw);padding:12px 14px 12px;background:rgba(9,15,25,.97);border:1px solid var(--amber);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:auto}
#bubble.shake{animation:shake .35s}
@keyframes shake{20%{margin-left:-7px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:5px}}
#cStep{font-size:10px;letter-spacing:.14em;color:var(--amber);font-weight:700;display:flex;justify-content:space-between;align-items:center}
#cStep .dots{display:flex;gap:3px}
#cStep .dots i{width:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
#cStep .dots i.d{background:var(--amber)}
#cMsg{font-size:17px;font-weight:700;line-height:1.35;margin-top:6px}
#cMsg em{font-style:normal;color:var(--amber)}
#cSub{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
#cSub b{color:var(--ink)}
#cSub:empty{display:none}
#cAct{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;align-items:center}
#cAct:empty{display:none}
#cAct .skip{margin-right:auto;font-size:11px;color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.btn{padding:8px 18px;border-radius:9px;font-weight:700;font-size:14px;background:var(--amber);color:#1a1200;border:1px solid transparent}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--dim)}
.btn.teal{background:var(--teal);color:#04170f}
.btn.big{padding:12px 28px;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}

/* ── 全螢幕 modal（標題／簡報／結算／四格表）──────── */
#modal{position:absolute;inset:0;z-index:60;display:none;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(10,20,34,.86),rgba(4,7,12,.96));overflow:auto;padding:16px}
#modal.on{display:grid}
@media (min-width:1000px){#modal.title{place-items:center start;padding-left:5vw}}
#modal.clear{background:radial-gradient(ellipse at 40% 50%,rgba(4,7,12,.6),rgba(4,7,12,.05))}
.card{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.kicker{font-size:11px;letter-spacing:.2em;color:var(--amber);font-weight:700;font-family:var(--mono)}
.card h1{font-size:clamp(28px,5.4vw,46px);line-height:1.12;margin:8px 0 10px;letter-spacing:.01em}
.card h1 em{font-style:normal;color:var(--teal)}
.card h2{font-size:22px;margin:6px 0 8px}
.card p{color:#c1d0dc;margin:6px 0}
.card p b{color:var(--ink)}
.card .lead{font-size:15.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.mlist{display:grid;gap:8px;margin-top:16px}
.mcard{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);width:100%;transition:border-color .15s,transform .1s}
.mcard:hover{border-color:var(--teal);transform:translateX(3px)}
.mcard .no{font-family:var(--mono);font-size:12px;color:var(--amber);font-weight:700;min-width:32px}
.mcard .t{font-weight:700;font-size:15px}
.mcard .d{font-size:12px;color:var(--dim);margin-top:1px}
.mcard .ok{margin-left:auto;color:var(--teal);font-weight:700;font-size:12px;white-space:nowrap}
.hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
.hint kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.05);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.stat{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-family:var(--mono)}
.stat span{font-size:11px;color:var(--dim)}
.stat.ok b{color:var(--teal)}.stat.no b{color:var(--red)}
.lesson{margin-top:12px;padding:12px 14px;border-left:3px solid var(--amber);background:rgba(245,185,66,.08);border-radius:0 10px 10px 0;color:#e6dcc0}
.lesson b{color:var(--amber)}

/* 四格表 / 換位子 */
.form4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box4{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.box4 h3{font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.box4 h3 em{font-style:normal;font-family:var(--mono);color:var(--amber)}
.box4 .fact{font-size:13px;line-height:1.6}
.box4 .fact b{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);transition:all .12s}
.chip:hover:not([disabled]){border-color:var(--dim)}
.chip.on{background:rgba(255,90,77,.18);border-color:var(--red);color:#ffc3bd}
.chip.sel{background:rgba(62,224,161,.16);border-color:var(--teal);color:var(--teal)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chip small{font-weight:400;color:var(--dim)}
.order{padding:12px 14px;border-radius:12px;background:rgba(245,185,66,.09);border:1px solid rgba(245,185,66,.5);margin-top:12px}
.order .who{font-size:11px;color:var(--amber);letter-spacing:.12em;font-weight:700}
.order .say{font-size:18px;font-weight:700;margin-top:3px}
.order .why{font-size:12px;color:var(--dim);margin-top:3px}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.view{padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.7}
.view h3{font-size:12px;letter-spacing:.1em;color:var(--dim);margin-bottom:4px}
.view.boss{border-color:rgba(245,185,66,.5)}
.view .miss{color:var(--red);font-weight:700}
.view b{font-family:var(--mono)}
.view .dim{color:var(--dim)}

.box4 .fact .bad{color:var(--red)}.box4 .fact .ok{color:var(--teal)}
.tip{padding:9px 12px;border-radius:10px;background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.45);font-size:13px;margin-top:12px;line-height:1.55}

#specbar{position:absolute;right:104px;bottom:12px;display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;justify-content:flex-end;max-width:min(520px,calc(100vw - 24px))}

/* ── 劇場模式 UI：所有選擇器以 #theater 為前綴，不污染遊戲本體 ─────────── */
#app.th-on #stage{transition:opacity .6s ease}
#theater{position:absolute;inset:0;z-index:20;pointer-events:none;font-family:var(--font);color:var(--ink)}
#theater .off{display:none!important}
#theater .th-catch{position:absolute;inset:0;pointer-events:auto}
#theater button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#theater .u{color:var(--teal)}#theater .e{color:#ff6a4a}#theater .e.stale{color:#8a8172}

/* 上方列 */
#theater .th-top{z-index:3;position:absolute;left:0;right:0;top:0;min-height:54px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:linear-gradient(180deg,rgba(4,7,12,.95),rgba(4,7,12,.6) 72%,rgba(4,7,12,0));pointer-events:auto}
#theater .th-back,#theater .th-auto,#theater .th-nav button{padding:7px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
#theater .th-back:hover,#theater .th-auto:hover,#theater .th-nav button:hover:not(:disabled){border-color:var(--dim)}
#theater .th-auto.on{border-color:var(--teal);color:var(--teal);background:rgba(62,224,161,.12)}
#theater .th-nav button:disabled{opacity:.35;cursor:not-allowed}
#theater .th-nav button.pri{background:var(--amber);color:#1a1200;border-color:transparent}
#theater .th-title{flex:1;min-width:0;line-height:1.25}
#theater .th-title small{display:block;font:700 10px var(--mono);letter-spacing:.18em;color:var(--amber)}
#theater .th-title b{font-size:17px}
#theater .th-title span{font-size:12px;color:var(--dim);margin-left:10px}
#theater .th-ctl{display:flex;align-items:center;gap:12px}
#theater .th-dots{display:flex;gap:4px}
#theater .th-dots i{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .3s}
#theater .th-dots i.d{background:var(--amber)}#theater .th-dots i.c{background:#fff}

/* 三層開關 */
#theater .th-layers{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#theater .th-layers button{display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--dim);white-space:nowrap;transition:all .15s}
#theater .th-layers button i{width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal}
#theater .th-layers button.on i::after{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
#theater .th-layers .l-o.on{color:var(--amber);border-color:var(--amber);background:rgba(245,185,66,.1)}
#theater .th-layers .l-b.on{color:#5aa9ff;border-color:#5aa9ff;background:rgba(90,169,255,.1)}
#theater .th-layers .l-g.on{color:var(--teal);border-color:var(--teal);background:rgba(62,224,161,.1)}
#theater .th-layers .l-e.on{color:#ff8fb1;border-color:#ff8fb1;background:rgba(255,143,177,.12)}
#theater .th-layers button small{font:700 9px var(--mono);letter-spacing:.12em;opacity:.75}

/* 卡片區 */
#theater .th-lay{position:absolute;left:0;right:0;top:100px;bottom:calc(var(--sayh,150px) + 26px)}
#theater .th-pane{position:absolute;background:rgba(8,14,24,.93);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:auto;max-height:100%;pointer-events:auto;animation:thIn .3s ease-out}
@keyframes thIn{from{opacity:0;transform:translateY(8px)}}
#theater .p-o{left:12px;top:0;width:262px;border-top:3px solid var(--amber)}
#theater .p-g{right:12px;top:0;width:296px;border-top:3px solid var(--teal)}
#theater .p-b{left:50%;top:0;margin-left:calc(min(470px,100vw - 660px) / -2);width:min(470px,calc(100vw - 660px));border-top:3px solid #5aa9ff}
#theater .p-e{left:50%;top:0;margin-left:calc(min(470px,100vw - 660px) / -2);width:min(470px,calc(100vw - 660px));border-top:3px solid #ff8fb1}
#theater .p-o.solo,#theater .p-b.solo,#theater .p-e.solo{left:50%;right:auto;top:2%;margin-left:calc(min(640px,94vw) / -2);width:min(640px,94vw)}
#theater .th-pane h4{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#theater .th-pane h4 span{font:800 10px var(--mono);letter-spacing:.16em;padding:2px 7px;border-radius:5px}
#theater .p-o h4 span{background:rgba(245,185,66,.2);color:var(--amber)}
#theater .p-b h4 span{background:rgba(90,169,255,.2);color:#5aa9ff}
#theater .p-g h4 span{background:rgba(62,224,161,.2);color:var(--teal)}
#theater .p-e h4 span{background:rgba(255,143,177,.2);color:#ff8fb1}
#theater .th-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

#theater .p-b:not(.solo) .th-grid.g4{grid-template-columns:1fr 1fr}
#theater .th-c{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0}

#theater b em{font-style:normal;font-size:11px;color:var(--dim);margin-left:8px;font-weight:500;font-family:var(--font)}
#theater b i.up,#theater b i.dn,#theater b i.fl{font-style:normal;font-size:12px;margin-left:6px}
#theater i.up{color:var(--teal)}#theater i.dn{color:var(--red)}#theater i.fl{color:var(--dim)}
#theater .th-lamp{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}

#theater .th-enemy small{display:block;font-size:11px;color:#c08a80;margin-top:2px}

#theater .th-blind{margin-top:8px;font-size:11.5px;color:var(--dim);line-height:1.55}
#theater .th-blind b{color:#ffb3ac}
#theater .th-chartbox{margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px}

#theater .p-e .th-c{padding:6px 9px;border-color:rgba(255,143,177,.22)}

/* ── 00-util.js ── */
'use strict';
/* 戰爭迷霧 · 專案管理即時戰略 — 單檔、零外部請求。模擬層與畫面層分離（見 20-sim / 40-render） */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const store = {
  get(k, d) { try { const v = localStorage.getItem('fogrts.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fogrts.' + k, JSON.stringify(v)); } catch (e) { } },
};
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  { id: 'proc', name: '流程改善', lv: [{ cost: 100, W: 50 }, { cost: 200, W: 90 }, { cost: 350, W: 150 }], need: null, fx: '生產與建造時間 −12%／級（複利）' },

    if (!t || u.cd <= 0) { const nt = nearestEnemy(w, u, WAR.acquire); if (nt && (!t || uDist(u, nt) < uDist(u, t) - .8)) t = nt; }
    u.tgt = t ? t.id : null;

/* ── 對手 AI：每 2.5 秒想一次。它只知道它「看得到」的東西 ── */

  },

const FX = {
  parts: [], floats: [], rings: [], beams: [],
  clear() { this.parts.length = 0; this.floats.length = 0; this.rings.length = 0; this.beams.length = 0; },
  beam(x0, y0, x1, y1, color) { this.beams.push({ x0, y0, x1, y1, color, t: 0, max: .16 }); this.spark(x1, y1, 13, color, 2); },
  spark(tx, ty, z, color, n = 3) {
    for (let i = 0; i < n; i++) this.parts.push({ tx, ty, z, ox: 0, oy: 0, vx: (Math.random() - .5) * 60, vy: -20 - Math.random() * 40, g: 160, t: 0, max: .35 + Math.random() * .25, color, s: 1.6 + Math.random() * 1.4 });
  },
  burst(tx, ty, z, color, n = 12) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, sp = 30 + Math.random() * 70; this.parts.push({ tx, ty, z, ox: 0, oy: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .6 - 30, g: 120, t: 0, max: .5 + Math.random() * .5, color, s: 2 + Math.random() * 2 }); }
  },
  float(tx, ty, text, color, z = 30) { this.floats.push({ tx, ty, z, text, color, t: 0, max: 1.3 }); },
  ring(tx, ty, r, color, max = .7) { this.rings.push({ tx, ty, r, color, t: 0, max }); },
  update(dt) {

  },
  floatStep(dt) { for (const f of this.floats) f.t += dt; this.floats = this.floats.filter(f => f.t < f.max); },

/* ── 35-view.js ── */
/* ── 視野投影：同一份世界 → 三種畫面（教材核心）。純讀取、無副作用 ─────────────────
   project(w, 'orbit')  老闆：4 個聚合數字 + 對手「結論卡」；沒有頻寬、建造佇列、技術債、個別工程師
   project(w, 'bridge') 主管：聚合指標 + 雙邊戰力對比；看得到「落後」，看不到原因
   project(w, 'ground') PM：己方全知；技術債只有蓋了 Detector 才有；對手只有偵察過的快照        */
function rivalPower(w) { return 98 + w.t * .12; }
function ourPower(w) { return engs(w).length * 10 * effMult(w); }
function project(w, role, g) {
  const us = engs(w), n = us.length, debt = debtTotal(w), used = supplyUsed(w), cap = supplyCap(w);
  const mining = us.filter(u => u.o.t === 'mine').length;
  if (role === 'orbit') {
    return {
      role, cash: Math.round(w.ore * 10000), people: w.units.filter(u => u.team === 0).length, share: w.nodes ? marketShare(w) : null,
      milestone: g && g.dp ? { text: g.dp.milestone, pct: clamp(g.dp.progress(w), 0, 1), left: Math.max(0, g.dp.deadline - w.t) } : { text: 'Q4 董事會', pct: .2, left: 0 },
      light: g && g.light || 'green',
      enemy: { headline: w.persona ? w.persona.headline(w.t) : '競品已上線「即時協作」', source: '市場報告', delayS: 60, sharp: true },
    };
  }
  if (role === 'bridge') {
    const pf = Math.min(.45, .15 * platCount(w)), fpow = feats(w).filter(u => u.type === 'feat').length * FEAT_POWER * (1 + pf) * archPower(w) * effMult(w);
    const our = w.nodes ? fpow : ourPower(w), riv = w.nodes && w.persona ? w.nodes.reduce((a, nd) => a + Math.max(0, w.persona.pow(nd, w.t, w)), 0) / 2 : rivalPower(w);
    return {
      role, efficiency: Math.round(100 * effMult(w) * (n ? mining / n : 0)), behind: Math.max(0, Math.round((riv - our) / riv * 100)), ourPower: Math.round(our), rivalPower: Math.round(riv),
      shared: w.nodes ? { us: ownedNodes(w), em: w.nodes.filter(nd => nd.owner === 1).length } : null,
      state: engs(w).some(u => u.o.t === 'build') || w.blds.some(b => !b.built) ? '產能建設中' : '運轉中',
    };
  }
  if (role === 'engineer') {
    const u = g && g.engFocus ? g.engFocus() : engs(w)[0]; if (!u) return { role, none: true };
    const near = o => Math.hypot(o.x - u.x, o.y - u.y) < ENG_SIGHT, fr = w.debts.filter(d => Math.hypot(d.x - u.x, d.y - u.y) < ENG_SIGHT + .3);
    const per = CHUNK * effMult(w) * mineMult(w), o = u.o;
    const task = o.t === 'mine' ? (o.ph === 'work' ? '採集中' : o.ph === 'back' ? '扛著東西送回去' : '走去礦點') : o.t === 'build' ? '蓋一座建築' : o.t === 'repay' ? '處理那一塊卡點' : o.t === 'research' ? '研發：' + (w.tech.cur ? w.tech.cur.name : '（沒有指定專案）') : o.t === 'move' ? '走到指定位置' : '沒事做（沒人給我票）';
    return { role, id: u.id, task, lastOrder: u.lastOrder || null, trip: +per.toFixed(1), full: CHUNK, slowed: per < CHUNK - .05, mates: w.units.filter(x => x !== u && x.team === 0 && near(x)).length, friction: Math.ceil(fr.reduce((a, d) => a + d.pts, 0) - 1e-6), blobs: fr.length, cd: Math.max(0, Math.ceil((u.reportCd || 0) - w.t)) };
  }
  const r = w.rival;
  return {
    role, workers: n, supply: { used, cap }, ore: Math.floor(w.ore), rate: w.rate,
    debt: w.detected ? Math.ceil(debt - 1e-6) : null,
    enemy: r ? { seenAgoS: r.seenAt < 0 ? null : Math.round(w.t - r.seenAt) } : null,
  };
}

}

/* ── 60-input.js ── */
/* ── 輸入：滑鼠／觸控／鍵盤。動作交給 G（其內先過 Coach 閘門）─────────── */
const Input = {
  down: null, drag: false, keys: new Set(), lastTap: 0,
  init() {
    const cv = $('#stage'), box = $('#dragbox');
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      SFX.init(); if (!G.w || Modal.isOpen) return; cv.setPointerCapture(e.pointerId);
      this.down = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, btn: e.button, touch: e.pointerType === 'touch', moved: false, cam: null };
      if (e.button === 2) { e.preventDefault(); }
    });
    cv.addEventListener('pointermove', e => {
      const d = this.down; G.hover = { x: e.clientX, y: e.clientY };
      if (G.place) G.placeAt(e.clientX, e.clientY, false);
      if (!d) return; const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
      if (!d.moved && Math.hypot(dx, dy) > 6) d.moved = true;
      if (!d.moved) return;
      if (d.btn === 1 || d.btn === 2 || (d.touch && !G.place)) { if (Coach.ok('camera', {})) { R.pan(-(e.clientX - d.x), -(e.clientY - d.y)); } }
      else if (d.btn === 0 && !d.touch && !G.place && G.role === 'ground') {
        box.style.display = 'block'; box.style.left = Math.min(d.sx, e.clientX) + 'px'; box.style.top = Math.min(d.sy, e.clientY) + 'px'; box.style.width = Math.abs(e.clientX - d.sx) + 'px'; box.style.height = Math.abs(e.clientY - d.sy) + 'px';
      }
      d.x = e.clientX; d.y = e.clientY;
    });
    const up = e => {
      const d = this.down; this.down = null; box.style.display = 'none'; if (!d || !G.w || Modal.isOpen) return;
      if (d.moved) {
        if (d.btn === 0 && !d.touch && !G.place && G.role === 'ground') { const us = R.unitsInRect(G.w, d.sx, d.sy, e.clientX, e.clientY); if (us.length) G.select(us.map(u => u.id)); }
        return;
      }
      if (d.btn === 2) { G.command(e.clientX, e.clientY); return; }
      if (d.btn !== 0) return;
      this.click(e.clientX, e.clientY);
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', () => { this.down = null; box.style.display = 'none'; });
    cv.addEventListener('wheel', e => { e.preventDefault(); if (!Coach.ok('camera', {})) return; R.zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); }, { passive: false });
    addEventListener('keydown', e => this.key(e)); addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
  },
  click(sx, sy) {
    const w = G.w; if (G.role !== 'ground') return;
    if (G.place) { G.placeAt(sx, sy, true); return; }
    if (G.cmdMode === 'move' || G.cmdMode === 'amove') { G.command(sx, sy); return; }
    const t = R.pick(w, sx, sy);
    if (t && t.kind === 'bld' && ((!t.built) || t.type === 'lab') && G.selUnits().some(u => u.type === 'eng')) { G.command(sx, sy); return; }
    if (t && (t.kind === 'unit' || t.kind === 'bld')) {
      const now = performance.now();
      if (t.kind === 'unit' && now - this.lastTap < 320 && G.sel.length === 1 && G.sel[0] === t.id) { const ids = w.units.filter(u => u.team === 0 && u.type === t.type && R.t2s(u.x, u.y).x > 0 && R.t2s(u.x, u.y).x < R.vw && R.t2s(u.x, u.y).y > 0 && R.t2s(u.x, u.y).y < R.vh).map(u => u.id); G.select(ids); }
      else G.select([t.id]);
      this.lastTap = now; return;
    }
    if (t && t.kind === 'node') { if (G.selUnits().length && G.has('move')) { G.command(sx, sy); return; } G.select([t.id]); return; }
    if (t && (t.kind === 'patch' || t.kind === 'debt') && G.selUnits().length) { G.command(sx, sy); return; }
    if (G.sel.length) G.select([], true);
  },
  key(e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    // 快捷鍵不分大小寫、不受 Caps Lock／Shift／中文輸入法影響：字母與數字優先用實體按鍵 e.code，其餘（F1、Esc、Tab、方向鍵、+）用 e.key
    const k = /^Key[A-Z]$/.test(e.code) ? e.code.slice(3).toLowerCase() : /^Digit[0-9]$/.test(e.code) ? e.code.slice(5) : String(e.key).toLowerCase(); this.keys.add(k);
    if ((e.metaKey || e.ctrlKey || e.altKey) && k !== 'f1') return;
    if (Modal.isOpen) return;
    if (k === 'escape') { if (G.cancelPlace()) return; if (G.sel.length && !Coach.active()) { G.select([], true); return; } G.menu(); return; }
    if (k === 'p') { G.togglePause(); return; }
    if (k === 'm') { $('#bMute').click(); return; }
    if (k === 'h') { G.goHome(); return; }
    if (k === 't') { G.toggleTech(); return; }
    if (k === 'f1') { e.preventDefault(); G.selectIdle(); return; }
    if (k === 'f2') { e.preventDefault(); G.selectArmy(); return; }
    if (k === ' ' && G.w && G.w.war) { e.preventDefault(); G.jumpAlert(); return; }
    if (k === '+' || k === '=') { G.cycleSpeed(); return; }
    if (G.has('views') && (k === '1' || k === '2' || k === '3' || k === '4')) { G.setRole({ '1': 'ground', '2': 'bridge', '3': 'orbit', '4': 'engineer' }[k]); return; }
    if (k === 'tab' && G.role === 'engineer') { e.preventDefault(); G.engCycle(e.shiftKey ? -1 : 1); return; }
    if (G.role === 'ground' && !e.ctrlKey && !e.metaKey && k.length === 1 && 'qweasdzxc'.includes(k)) { if (UI.cardKey(k)) e.preventDefault(); }
  },
  step(dt) { // 鍵盤移動鏡頭
    if (Modal.isOpen || !Coach.ok('camera', {}, true)) return; const k = this.keys; let dx = 0, dy = 0;
    if (k.has('arrowleft')) dx -= 1; if (k.has('arrowright')) dx += 1; if (k.has('arrowup')) dy -= 1; if (k.has('arrowdown')) dy += 1;
    if (dx || dy) R.pan(dx * 600 * dt, dy * 600 * dt);
  },
};

/* ── 70-coach.js ── */
/* ── 教學引擎：一次一步。等待時遊戲暫停，只放行「亮起的那個動作」；做完才播一小段結果 ───── */
const Coach = {
  steps: null, i: -1, state: 'off', mark: null, onEnd: null, n: 0, total: 0, nudgeT: 0,
  active() { return this.state !== 'off'; },
  cur() { return this.steps && this.steps[this.i]; },
  start(steps, opts = {}) {
    this.steps = steps; this.onEnd = opts.onEnd || null; this.i = -1; this.n = 0; this.total = steps.filter(s => s.count !== false).length;
    $('#coach').classList.remove('off'); this.next();
  },
  stop() { this.state = 'off'; this.steps = null; this.mark = null; this.i = -1; $('#coach').classList.add('off'); $$('.tut').forEach(e => e.classList.remove('tut')); },

  ok(kind, data, silent) {
    if (this.state === 'off') return true;
    if (this.state === 'beat') return false;
    const s = this.cur(); if (!s) return true;
    if (kind === 'camera') return !!s.camera;
    const r = !!(s.ok && s.ok(kind, data, G));
    if (!r && !silent) this.nudge();
    return r;
  },
  nudge() {
    const now = performance.now(); if (now - this.nudgeT < 400) return; this.nudgeT = now;
    const b = $('#bubble'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); SFX.play('warn');
  },
  event(t, d) {
    if (this.state !== 'wait') return; const s = this.cur(); if (!s || !s.done) return;
    if (s.done(t, d, G)) this.finish();
  },
  finish() {
    const s = this.cur(); SFX.play('ping'); this.mark = null; $$('.tut').forEach(e => e.classList.remove('tut'));
    if (s.after) s.after(G);
    if (s.beat) {
      this.state = 'beat'; this.showCap(s.beat.cap);
      G.runBeat({ sec: s.beat.sec, speed: s.beat.speed, until: s.beat.until ? () => s.beat.until(G) : null });
    } else this.next();
  },
  beatDone() { if (this.state === 'beat') this.next(); },
  next() {
    this.i++;
    if (this.i >= this.steps.length) { const cb = this.onEnd; this.stop(); if (cb) cb(); return; }
    this.enter();
  },
  enter() {
    const s = this.cur(); this.state = 'wait'; if (s.count !== false) this.n++;
    if (s.enter) s.enter(G);
    const b = $('#bubble'); b.classList.remove('cap');

/* ── 82-m3.js ── */
/* ═════ 第 3 關：老闆看不到的 · 三層視野 + 四格表 + 信任 ═════
   流程：暫停式「換位子」教學（老闆／主管／PM）→ 決策點 1（加人令，頻寬其實已滿）→ 四格表 → 結算＋換位子重看
        → 決策點 2（趕工令，隱形技術債）→ 結算。過關：信任 ≥ 50 且送出 2 次「標中」的預警。 */
const RISKS = [['supply', '頻寬已滿 ▤'], ['ore', '預算不夠 ●'], ['debt', '技術債偏高'], ['time', '時程估不準'], ['rnd', '研發投入中，產出暫時下降']];
const LIGHT = { green: '綠', yellow: '黃', red: '紅' };

function estimate(g) {
  const w = g.w, dp = g.dp, left = Math.max(0, dp.deadline - w.t);
  if (dp.key === 'headcount') {
    const n = engs(w).length, need = Math.max(0, dp.target - n), used = supplyUsed(w), cap = supplyCap(w);
    const comms = w.blds.some(b => b.type === 'comms') ? 0 : (used + need > cap ? 17 : 0);
    const est = Math.round(need * BASE_TRAIN * w.pace.mult + comms);
    return { late: est > left * .9, line: `預估還要 <b class="${est > left ? 'bad' : est > left * .9 ? '' : 'ok'}">${est} 秒</b>　·　剩 <b>${Math.round(left)} 秒</b>${comms ? '（含先蓋協作制度 ≈17 秒）' : ''}` };
  }
  if (dp.key === 'cash') {
    const need = (dp.oreTarget - w.ore) / Math.max(1, left);
    return { late: need > w.rate * 1.02, line: `目標需平均 <b class="${need > w.rate ? 'bad' : 'ok'}">${need.toFixed(1)} ●/s</b>　·　你現在 <b>${w.rate.toFixed(1)} ●/s</b>` };
  }
  const p = clamp(dp.progress(w), 0, 1), el = clamp(1 - left / dp.secs, 0, 1);
  return { late: p < el * .75 && p < 1, line: `目前完成 <b class="${p >= el ? 'ok' : 'bad'}">${Math.round(p * 100)}%</b>　·　時間已過 <b>${Math.round(el * 100)}%</b>　·　剩 <b>${Math.round(left)} 秒</b>` };
}
function riskTruth(g) {
  const w = g.w, used = supplyUsed(w), cap = supplyCap(w);
  const lab = labOf(w);
  return { supply: used >= cap - 1, ore: w.ore < 120, debt: (w.detected || pingsActive(w).length) ? debtTotal(w) >= 6 : null, time: estimate(g).late, rnd: lab ? labAssigned(w, lab).length > 0 : null };
}
function snapshot(g) { const w = g.w; return { pm: project(w, 'ground', g), boss: project(w, 'orbit', g), used: supplyUsed(w), cap: supplyCap(w), debtTrue: Math.ceil(debtTotal(w) - 1e-6), detected: w.detected, ore: Math.floor(w.ore), rate: w.rate, feats: feats(w).length, rs: labOf(w) ? labAssigned(w, labOf(w)).length : 0, share: marketShare(w), nodes: ownedNodes(w), upkeep: w.upkeep || 0 }; }

/* 通用決策點：o = {key,who,say,why,secs,milestone,progress(w),done(w),pmLines(s),bossLines(s),note} ；meta = {idx,total,first,onNext(g)} */
function openDP(g, o, meta) {
  const w = g.w, snap = snapshot(g), first = !!meta.first;
  const m = Modal.show(`<div class="card"><div class="kicker">DECISION POINT ${meta.idx + 1} / ${meta.total} · 老闆的指令卡</div>
    <div class="order"><div class="who">${o.who}</div><div class="say">「${o.say}」</div><div class="why">${o.why}</div></div>
    <div class="stats"><div class="stat"><b>${o.milestone}</b><span>老闆要的結果</span></div><div class="stat"><b>${o.secs}s</b><span>期限</span></div><div class="stat"><b>♥ ${Math.round(w.trust)}</b><span>目前信任</span></div></div>
    ${first ? `<div class="tip"><b>你看得到，他看不到。</b>你的畫面上：頻寬 <b>▤ ${snap.used}/${snap.cap}</b>。老闆的畫面沒有這一格。接下來你要練的是<b>事前預警</b> —— 失約之前，在四格表把風險標紅。<br>操作忘了？選工程師按 <b>Q</b> 蓋協作制度、選基地按 <b>Q</b> 訓練。</div>` : `<div class="tip">${o.note || '這個指令，你的畫面上看到什麼、他的畫面上看到什麼？想清楚再回報。'}</div>`}
    <div class="row"><button class="btn teal big" id="ok">接令，開始計時 ▶</button></div></div>`);
  m.querySelector('#ok').onclick = () => {
    SFX.init(); Modal.hide();
    g.dp = { idx: meta.idx, total: meta.total, key: o.key, milestone: o.milestone, short: o.say.length > 26 ? o.say.slice(0, 25) + '…' : o.say, deadline: w.t + o.secs, secs: o.secs, target: o.target, ore0: o.ore0, oreTarget: o.oreTarget,
      reported: false, flags: [], valid: [], extended: false, resolved: false, snap, progress: o.progress, done: o.done, pmLines: o.pmLines, bossLines: o.bossLines, engLines: o.engLines, onNext: meta.onNext, nextLabel: meta.nextLabel };
    g.light = 'green'; UI.feed(meta.idx === 0 ? '點上方「📋 回報老闆」— 事前預警不花任何資源' : '想清楚風險是什麼再回報 — 標「現在真的存在」的', 'good'); SFX.play('ping');
    if (!meta.noFocus) R.focus(bcx(hubOf(w)), bcy(hubOf(w)) + 1, R.playZoom());
  };
}

function startDP(g, idx) { // 第 3 關專用的兩個決策點
  const w = g.w; let cashGain = 0;
  if (idx === 1) {
    w.pace = PACE.normal; ['obs', 'pace', 'repay'].forEach(k => g.unlocked.add(k)); UI.sigCard = '';
    for (let i = 0; i < 6; i++) addDebt(w, 3.34);   // 散成 6 塊：工程師一次只看得到腳邊那幾塊
    const hr = engs(w).length * (CHUNK / (MINE_T + 1.4)); cashGain = Math.round(.47 * hr * 150 * 10000 / 100000) * 100000;
  }
  const b = bossOrder(w, g, idx, { cashGain }), ore0 = w.ore, oreTarget = Math.floor(w.ore + cashGain / 10000);
  const o = { ...b, ore0, oreTarget,
    progress: b.key === 'headcount' ? w => engs(w).length / b.target : w => (w.ore - ore0) / Math.max(1, oreTarget - ore0),
    done: b.key === 'headcount' ? w => engs(w).length >= b.target : w => w.ore >= oreTarget,
    pmLines: idx === 0 ? s => `工程師 <b>${s.pm.workers}</b> · 預算 ● <b>${s.ore}</b><br>管理頻寬 <b class="miss">▤ ${s.used}/${s.cap}（已滿）</b><br><span class="dim">→ 要加人，先得蓋協作制度</span>`
      : s => `工程師 <b>${s.pm.workers}</b> · 產出 <b>${s.rate.toFixed(1)}</b> ●/s<br>技術債 <b class="${s.detected ? '' : 'miss'}">${s.detected ? s.debtTrue : '？'}</b><br><span class="miss">真相：技術債 ${s.debtTrue} 點${s.detected ? '' : '（你當時看不到）'}</span>`,
    bossLines: idx === 0 ? s => `現金 <b>NT$${(s.boss.cash / 1e6).toFixed(1)}M</b><br>人數 <b>${s.boss.people}</b><br>燈號 <b>${LIGHT.green}</b><br><span class="miss">沒有「管理頻寬」這一格</span><br><span class="dim">→ 「錢夠就該加人」在他的畫面上完全合理</span>`
      : s => `現金 <b>NT$${(s.boss.cash / 1e6).toFixed(1)}M</b><br>人數 <b>${s.boss.people}</b><br>競品：<b>已上線「即時協作」</b><br><span class="miss">沒有「技術債」這一格</span><br><span class="dim">→ 「為什麼慢？全面趕工」在他的畫面上完全合理</span>`,
    engLines: idx === 0 ? s => `我只收到：「去採礦」「多接一點，新人會來」。<br>新人誰帶？沒人說。我手上三張票都還沒做完。<br><span class="miss">我不知道頻寬已經滿了</span>` : s => `我早就覺得慢了 —— 每趟帶回的比以前少，旁邊的程式碼動一處要繞三處。<br><span class="miss">沒人問過我，我也不知道這叫「技術債」</span><br><span class="dim">→ 想知道？到我的位子（按 4）按「回報」</span>`,
    note: idx === 1 ? '<b>這次換技術債。</b>老闆建議「硬趕」，但你看得到趕工的後果嗎？<b>最便宜的偵測器是工程師</b> —— 按 4 附身一位，按「回報」，他腳邊的卡點會亮給你（局部、限時 60 秒）。' : null };
  openDP(g, o, { idx, total: 2, first: idx === 0 && !g.tag.seenDP, onNext: g2 => { if (idx === 0) startDP(g2, 1); else g2.finish(g2.w.trust >= 50 && g2.tag.validWarn >= 2, {}); }, nextLabel: idx === 0 ? '下一個決策點 ▶' : '看總結 ▶' });
  g.tag.seenDP = true;
}

const Report = {
  open() {
    const g = G, w = g.w, dp = g.dp; if (!dp || dp.resolved || dp.reported) return;
    const truth = riskTruth(g), est = estimate(g), used = supplyUsed(w), cap = supplyCap(w), n = engs(w).length, debt = Math.ceil(debtTotal(w) - 1e-6);
    const pct = Math.round(clamp(dp.progress(w), 0, 1) * 100);
    const prog = dp.key === 'headcount' ? `工程師 <b>${n}</b> / ${dp.target}` : dp.key === 'cash' ? `現金 <b>${Math.floor(w.ore)}</b> / ${dp.oreTarget} ●` : `完成度 <b>${pct}%</b>` + (w.nodes ? `<br>據點 <b>${ownedNodes(w)}</b> · 市佔 <b>${marketShare(w)}%</b>` : '') + (feats(w).length ? `<br>功能 <b>${feats(w).length}</b> · 維運 −${(w.upkeep || 0).toFixed(2)}/s` : '') + (labOf(w) && labAssigned(w, labOf(w)).length ? `<br>研發 <b>${labAssigned(w, labOf(w)).length}</b> 人（不採礦）` : '');
    const first = dp.idx === 0 && !g.tag.reportedOnce;
    const m = Modal.show(`<div class="card"><div class="kicker">STATUS REPORT · 狀態報告（四格表）</div>
      <h2>只有四格，你要塞進正確的資訊</h2>
      <div class="order" style="margin-top:8px"><div class="who">老闆的指令</div><div class="say" style="font-size:15px">「${dp.milestone}」· 剩 ${Math.round(dp.deadline - w.t)} 秒</div></div>
      <div class="form4">
        <div class="box4"><h3>① 進度<em>你的畫面</em></h3><div class="fact">${prog}<br>管理頻寬 <b class="${used >= cap ? 'bad' : ''}">▤ ${used}/${cap}</b>${used >= cap ? '（已滿）' : ''}<br>產出 <b>${w.rate.toFixed(1)}</b> ●/s<br>技術債 <b>${w.detected ? debt : pingsActive(w).length ? '≥' + pingsActive(w).reduce((a, p) => a + p.n, 0) : '？'}</b>${w.detected ? '' : pingsActive(w).length ? '（工程師回報，局部）' : '（沒有 Detector，你也看不到）'}</div></div>
        <div class="box4"><h3>② 風險<em>標紅＝預警</em></h3><div class="chips" id="risks">${RISKS.map(([k, t]) => truth[k] === null ? `<button class="chip" disabled>${t} <small>🔒 ${k === 'rnd' ? '尚無研發中心' : '需要 Detector'}</small></button>` : `<button class="chip${first && k === 'supply' ? ' hintpulse' : ''}" data-k="${k}">${t}</button>`).join('')}</div><div class="ex">只標「現在真的存在」的風險。標中＝有效預警。</div></div>
        <div class="box4"><h3>③ 需要<em>向老闆要什麼</em></h3><div class="chips" id="needs"><button class="chip sel" data-n="none">不需要</button>${dp.extended ? '' : '<button class="chip" data-n="extend">請延長 30 秒 <small>信任 −3</small></button>'}</div></div>
        <div class="box4"><h3>④ 預估<em>你的判斷</em></h3><div class="fact">${est.line}</div></div>
      </div>
      ${first ? '<div class="tip"><b>第一次：</b>② 你看得到「頻寬已滿」，老闆看不到。<b>把它標紅</b> —— 不花任何資源，但失約時信任 <b>−12</b> 會變成 <b>−4</b>。</div>' : ''}
      <div class="row"><button class="btn teal" id="send">送出四格表</button><button class="btn ghost" id="cancel">先不回報，回遊戲</button></div></div>`);
    const flags = new Set(); let need = 'none'; g.tag.reportedOnce = true;
    m.querySelectorAll('#risks .chip[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; flags.has(k) ? flags.delete(k) : flags.add(k); b.classList.toggle('on', flags.has(k)); b.classList.remove('hintpulse'); SFX.play('click'); });
    m.querySelectorAll('#needs .chip').forEach(b => b.onclick = () => { need = b.dataset.n; m.querySelectorAll('#needs .chip').forEach(x => x.classList.toggle('sel', x === b)); SFX.play('click'); });
    m.querySelector('#cancel').onclick = () => Modal.hide();
    m.querySelector('#send').onclick = () => {
      Modal.hide(); dp.reported = true; dp.flags = [...flags]; dp.valid = dp.flags.filter(k => truth[k] === true);
      if (need === 'extend' && !dp.extended) { dp.extended = true; dp.deadline += 30; g.addTrust(-3, '要求延期'); }
      if (dp.valid.length) { g.tag.validWarn++; g.light = 'yellow'; UI.alert('老闆看到黃燈 — 你事前預警了（標中）', 'good'); }
      else if (dp.flags.length) UI.alert('你標的風險目前不成立 — 預警要標「現在看得到的」', 'warn');
      else UI.feed('你回報了「一切順利」— 老闆的燈號是綠的', 'warn');
      SFX.play('ping');
    };
  },
};

function resolveDP(g) {
  const dp = g.dp, w = g.w; if (dp.resolved) return; dp.resolved = true; const ok = dp.done(w);
  let delta, label;
  if (ok) { delta = 6; label = '達成'; } else if (dp.valid.length) { delta = -4; label = '未達成，但你事前預警了'; } else { delta = -12; label = '未達成，而且沒有有效預警'; }
  g.addTrust(delta, label); g.tag.results.push({ idx: dp.idx, ok, delta, label, warned: dp.valid.length > 0 }); g.emit('dpResolved', { ok, delta, label, idx: dp.idx });
  const s = dp.snap, before = w.trust - delta, lamp = dp.valid.length ? 'yellow' : 'green'; g.light = 'green';
  const m = Modal.show(`<div class="card"><div class="kicker">決策點 ${dp.idx + 1} 結算 · 換位子重看同一刻</div>
    <h2>${ok ? '✔ ' : '✖ '}${label}</h2>
    <div class="stats"><div class="stat ${delta > 0 ? 'ok' : 'no'}"><b>♥ ${Math.round(before)} → ${Math.round(w.trust)}</b><span>信任 ${delta > 0 ? '+' : ''}${delta}</span></div><div class="stat ${dp.valid.length ? 'ok' : ''}"><b>${dp.valid.length ? '有效' : dp.flags.length ? '標錯' : '沒有'}</b><span>事前預警</span></div><div class="stat"><b><i class="lamp ${lamp}"></i>${LIGHT[lamp]}</b><span>老闆看到的燈號</span></div></div>
    <div class="swap"><div class="view"><h3>你當時看到的 · PM 地面層</h3>${dp.pmLines(s)}</div><div class="view boss"><h3>老闆當時看到的 · 軌道層</h3>${dp.bossLines(s)}</div>${dp.engLines ? `<div class="view eng"><h3>工程師當時看到的 · 執行層</h3>${dp.engLines(s)}</div>` : ''}</div>
    <div class="lesson">${delta === -12 ? '<b>沒有預警的失約 −12。</b>' : delta === -4 ? '<b>同樣失約，預警把 −12 變 −4</b>（止血三分之二，而且成本為零）。' : '<b>達成 +6。</b>但別忘了，要的是「標中的預警」——不是只要把事做完。'} 老闆不是刁難你，他的畫面上真的沒有那個資訊。</div>
    <div class="row"><button class="btn teal big" id="nx">${dp.nextLabel || '繼續 ▶'}</button></div></div>`);
  m.querySelector('#nx').onclick = () => { Modal.hide(); if (dp.onNext) dp.onNext(g); };
}

MISSIONS.push({

    if (g.dp && !g.dp.resolved) { if (g.dp.done(w) || w.t >= g.dp.deadline) (g.spectate ? quietResolve : resolveDP)(g); else if (g.spectate) autoWarn(g); }

  /* ── 繪製 ── */
  render() {

    setPane(pe, on('e'), nOn === 1, `<h4><span>ENGINEER</span>執行層 · 工程師</h4>${step && step.engNote ? `<div class="th-enote">${step.engNote}</div>` : ''}${this.chipsE(S, D)}`);

    else if (on('e') && !tri) { const bh = !pb.classList.contains('off') && !pb.classList.contains('solo') ? pb.offsetHeight : 0, top = bh ? bh + 8 : 0; pe.style.top = pe.classList.contains('solo') ? '' : top + 'px'; pe.style.maxHeight = pe.classList.contains('solo') ? '' : `calc(100% - ${top}px)`; }
    tr.classList.toggle('off', !tri);

    if (tri) { delete tr.dataset.us; tr.scrollTop = 0; const st0 = st; this.later(2600, () => { const cc = this.cur; if (cc && cc.step === st0 && cc.triple && !tr.dataset.us) tr.scrollTo({ top: tr.scrollHeight, behavior: 'smooth' }); }); }
    // 地圖：PM 層關掉 → 淡出；並排 → 壓暗；活路頁 → 暗

    wy.innerHTML = ways ? `<div class="th-wi"><div class="kicker">${c.sc.kicker} · 三條活路</div><h3>${c.sc.title}</h3><p class="hook">${c.sc.hook}</p>

const Stats = {

  reset(w) {

  tick(w, g, dt) {

  sample(w, g) {

      used: supplyUsed(w), cap: supplyCap(w), blocked: !!w.isBlocked && (typeof Coach === 'undefined' || Coach.state === 'off'), crew, tech: w.tech && w.tech.cur ? w.tech.cur.name : null,

  ev(w, type, text, color, icon) {

  onEvent(type, d) {

      case 'dpResolved': this.ev(w, 'dp', `決策點：${d.label}（♥${d.delta > 0 ? '+' : ''}${d.delta}）`, '#f5b942', '◆'); break;

  },

  /* ── 圖表 ── */

  tabs() {

  },
  chart(kind, W) {

    const t1 = Math.max(10, S[S.length - 1].t), x = t => L + clamp(t / t1, 0, 1) * iw;

    for (let t = 0; t <= t1 + .01; t += st) g += `<line x1="${x(t)}" y1="${T}" x2="${x(t)}" y2="${T + ih}" stroke="rgba(130,180,215,.08)"/><text x="${x(t)}" y="${H - 7}" class="st-ax" text-anchor="middle">${this.fmt(t)}</text>`;
    const axisL = (max, unit) => { let s = ''; for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = T + ih - ih * i / 4; s += `<line x1="${L}" y1="${y}" x2="${L + iw}" y2="${y}" stroke="rgba(130,180,215,${i ? .07 : .2})"/><text x="${L - 5}" y="${y + 3.5}" class="st-ax" text-anchor="end">${Math.round(v)}${unit || ''}</text>`; } return s; };
    const axisR = (max, unit, col) => { let s = ''; for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = T + ih - ih * i / 4; s += `<text x="${L + iw + 5}" y="${y + 3.5}" class="st-ax" fill="${col}" style="fill:${col}">${(max < 10 && v % 1) ? v.toFixed(1) : Math.round(v)}${unit || ''}</text>`; } return s; };

    };
    const bands = (pred, col, op) => { let s = '', a = null; for (let i = 0; i < S.length; i++) { const on = pred(S[i]); if (on && a == null) a = S[i].t; if ((!on || i === S.length - 1) && a != null) { const b2 = on ? S[i].t : S[i].t; s += `<rect x="${x(a)}" y="${T}" width="${Math.max(2, x(b2) - x(a))}" height="${ih}" fill="${col}" opacity="${op}"/>`; a = null; } } return s; };
    let legend = [];

    } else if (kind === 'power') {

      legend = [['#3ee0a1', '我方戰力'], ['#ff5a4d', '對手戰力（主管看到的）']];
      if (S.some(s => s.share != null)) { g += axisR(100, '%', '#f5b942') + line('share', 100, '#f5b942', { dash: '5 4' }); legend.push(['#f5b942', '市佔 %（右軸）']); }
      if (S.some(s => s.army != null)) { const ma = this.niceMax(Math.max(1, ...S.map(s => s.army || 0))); g += line('army', ma, '#ff9f8c', { dash: '2 3', w: 1.6 }); legend.push(['#ff9f8c', `對手單位數（0–${ma}）`]); }
    } else if (kind === 'crew') {

      g += bands(s => s.blocked, '#ff5a4d', .16) + axisL(md);

      legend = [['#ff6b9a', '技術債（實線＝PM 看得見、虛線＝看不見）']];

    const lg = legend.map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');
    return `<div class="st-legend">${lg}</div><svg class="st-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="賽後曲線">${g}</svg>`;
  },

  /* ── 關鍵數字與教材解讀 ── */
  summary() {

      else if (fd != null && fs - fd >= 15) reads.push(`技術債從 ${this.fmt(fd)} 開始累積，你到 ${this.fmt(fs)} 才看見 —— <b>中間 ${Math.round(fs - fd)} 秒，你在為看不見的東西付錢</b>。`);

    else if (t === 'dpResolved') this.say('信任', `決策點結算：<b>${d.label}</b>（信任 ${d.delta > 0 ? '+' : ''}${d.delta} → ${Math.round(w.trust)}）`, 3);

/* 觀戰用的決策點：不開視窗；PM 自動駕駛在時間過了三成、而且看起來會失約時，送出標中的預警 */
function quietDP(g, o, k) {
  const w = g.w;
  g.dp = { idx: k, total: 5, key: o.key, milestone: o.milestone, short: o.say.length > 26 ? o.say.slice(0, 25) + '…' : o.say, deadline: w.t + o.secs, secs: o.secs, target: o.target, ore0: o.ore0, oreTarget: o.oreTarget,
    reported: false, flags: [], valid: [], extended: false, resolved: false, snap: snapshot(g), progress: o.progress, done: o.done, pmLines: o.pmLines, bossLines: o.bossLines, engLines: o.engLines, nextLabel: '繼續 ▶' };
  g.light = 'green'; g.emit('dpOpen', { say: o.say, idx: k });
}
function autoWarn(g) {
  const dp = g.dp, w = g.w; if (dp.reported || w.t < dp.deadline - dp.secs * .7) return;
  const est = estimate(g); if (!est.late) return;
  const truth = riskTruth(g), flags = Object.keys(truth).filter(k => truth[k] === true).slice(0, 2); if (!flags.length) flags.push('time');
  dp.reported = true; dp.flags = flags; dp.valid = flags.filter(k => truth[k] === true || k === 'time' && est.late);
  if (dp.valid.length) { g.tag.validWarn++; g.light = 'yellow'; }
  g.emit('dpWarn', { flags: flags.map(k => (RISKS.find(r => r[0] === k) || [k, k])[1]).join('、') });
}
function quietResolve(g) {
  const dp = g.dp, w = g.w; if (dp.resolved) return; dp.resolved = true; const ok = dp.done(w);
  const delta = ok ? 6 : dp.valid.length ? -4 : -12, label = ok ? '達成' : dp.valid.length ? '未達成，但事前預警了' : '未達成，而且沒有預警';
  w.trust = clamp(w.trust + delta, 0, 100); w.tag.microOn = true; g.tag.results.push({ idx: dp.idx, ok, delta, label, warned: dp.valid.length > 0 }); g.light = 'green';
  g.emit('dpResolved', { ok, delta, label, idx: dp.idx });
}
